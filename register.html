<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sunnyluo Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .register-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 400px; }
        .register-box h1 { text-align: center; color: #03a9f4; margin-bottom: 30px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        .register-btn { width: 100%; padding: 14px; background: #03a9f4; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .login-link { text-align: center; margin-top: 20px; }
        .back-home { text-align: center; margin-top: 10px; }
        .back-home a { color: #666; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-box">
        <h1>Join Free</h1>
        <div class="form-group">
            <label>Company Name</label>
            <input type="text" placeholder="Enter your company name">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Set your password">
        </div>
        <button class="register-btn" onclick="register()">Register</button>
        <div class="login-link">
            Already have an account? <a href="login.html" style="color: #03a9f4;">Sign in</a>
        </div>
        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
    <script>
        function register() {
            // 后面这里接你任务平台的注册接口
            alert('Register success! Welcome to Sunnyluo Store!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
