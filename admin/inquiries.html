<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiries Management - Sunnyluo Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #222; color: white; padding: 20px 0; }
        .sidebar h2 { padding: 0 20px; margin-bottom: 30px; color: #FF6A00; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 15px 20px; cursor: pointer; }
        .sidebar ul li:hover { background: #333; }
        .sidebar ul li.active { background: #03a9f4; }
        .main { flex: 1; background: #f5f5f5; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .table-container { background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; }
        th { background: #f9f9f9; font-weight: bold; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .status-new { color: #FF6A00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li onclick="window.location.href='dashboard.html'">Dashboard</li>
            <li onclick="window.location.href='products.html'">Products Management</li>
            <li class="active">Inquiries</li>
            <li onclick="window.location.href='customers.html'">Customers</li>
            <li>Orders</li>
            <li>Marketing Emails</li>
            <li>Settings</li>
        </ul>
    </div>
    <div class="main">
        <div class="header">
            <h1>Inquiries Management</h1>
        </div>
        <div style="background: white; padding: 0 20px; border-radius: 8px 8px 0 0; border-bottom: 1px solid #eee;">
            <div style="display: flex; gap: 30px;">
                <button style="padding: 15px 0; border: none; background: none; font-size: 16px; font-weight: bold; color: #03a9f4; border-bottom: 2px solid #03a9f4;">All Inquiries</button>
                <button style="padding: 15px 0; border: none; background: none; font-size: 16px; color: #FF6A00; cursor: pointer;">New (2)</button>
                <button style="padding: 15px 0; border: none; background: none; font-size: 16px; color: #666; cursor: pointer;">Replied</button>
                <button style="padding: 15px 0; border: none; background: none; font-size: 16px; color: #666; cursor: pointer;">Archived</button>
            </div>
        </div>
        <div class="table-container" style="border-radius: 0 0 8px 8px; border-top: none;">
            <div class="empty-state">
                <h3>No New Inquiries</h3>
                <p style="margin-top: 10px;">When customers send inquiries from the product page, they will appear here.</p>
            </div>
        </div>
    </div>
</body>
</html>
