<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management - Sunnyluo Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #222; color: white; padding: 20px 0; }
        .sidebar h2 { padding: 0 20px; margin-bottom: 30px; color: #FF6A00; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 15px 20px; cursor: pointer; }
        .sidebar ul li:hover { background: #333; }
        .sidebar ul li.active { background: #03a9f4; }
        .main { flex: 1; background: #f5f5f5; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .table-container { background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; }
        th { background: #f9f9f9; font-weight: bold; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li onclick="window.location.href='dashboard.html'">Dashboard</li>
            <li onclick="window.location.href='products.html'">Products Management</li>
            <li onclick="window.location.href='inquiries.html'">Inquiries</li>
            <li onclick="window.location.href='customers.html'">Customers</li>
            <li class="active">Orders</li>
            <li onclick="window.location.href='marketing.html'">Marketing Emails</li>
            <li onclick="window.location.href='settings.html'">Settings</li>
        </ul>
    </div>
    <div class="main">
        <div class="header">
            <h1>Orders Management</h1>
        </div>
        <div class="table-container">
            <div class="empty-state">
                <h3>No Orders Yet</h3>
                <p style="margin-top: 10px;">When customers place orders, they will appear here. You can manage order status, shipping, and payment here.</p>
            </div>
        </div>
    </div>
</body>
</html>
